name: Update synapify Cask

# Receives the repository_dispatch that synapify's release.yml sends after it
# uploads the macOS release artifacts, and regenerates Casks/synapify.rb with
# the new version + sha256. Requires HOMEBREW_TAP_SECRET (a PAT with write
# access to this repo) to be set on the synapify repo.
#
# Synapify is a GUI .app, so it is a cask rather than a formula. Unlike
# update-formula.yml there is no name whitelist to apply here: the output path
# Casks/synapify.rb is fixed by this workflow, not taken from the payload.
#
# Synapify has no beta cask, so a prerelease must not reach this workflow at
# all. That guard lives on the sending side, as `if: github.event.release
# .prerelease != true` on synapify's update-homebrew job.

on:
  repository_dispatch:
    types: [update-synapify]

jobs:
  update-synapify:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout homebrew-tap
      uses: actions/checkout@v4

    - name: Extract payload
      id: payload
      env:
        IN_VERSION: ${{ github.event.client_payload.version }}
        IN_SHA_MACOS_ARM64: ${{ github.event.client_payload.sha_macos_arm64 }}
      run: |
        # Both values are sender-controlled and land verbatim in a generated
        # Ruby file, so validate rather than trust. A malformed sha256 would
        # otherwise produce a cask that fails every download with a checksum
        # mismatch — a confusing way to find out the payload was wrong.
        if ! printf '%s' "${IN_VERSION}" | grep -Eq '^[0-9][0-9a-zA-Z.+-]*$'; then
          echo "::error::Invalid version '${IN_VERSION}' in client_payload.version"
          exit 1
        fi
        if ! printf '%s' "${IN_SHA_MACOS_ARM64}" | grep -Eq '^[0-9a-f]{64}$'; then
          echo "::error::Invalid sha256 '${IN_SHA_MACOS_ARM64}' in client_payload.sha_macos_arm64"
          exit 1
        fi

        {
          echo "version=${IN_VERSION}"
          echo "sha_macos_arm64=${IN_SHA_MACOS_ARM64}"
        } >> "$GITHUB_OUTPUT"

    - name: Generate cask
      env:
        TAG: ${{ steps.payload.outputs.version }}
        SHA_MACOS_ARM64: ${{ steps.payload.outputs.sha_macos_arm64 }}
      run: |
        mkdir -p Casks
        envsubst '$TAG $SHA_MACOS_ARM64' > Casks/synapify.rb << 'CASK'
        # Homebrew cask for Synapify - the visual RIDDL editor
        # To install: brew install --cask ossuminc/tap/synapify
        # Or add the tap first: brew tap ossuminc/tap && brew install --cask synapify
        # Auto-generated by update-synapify.yml - do not edit manually

        cask "synapify" do
          version "${TAG}"
          sha256 "${SHA_MACOS_ARM64}"

          # ossuminc/synapify is a private repo, so its GitHub release assets
          # 404 for anonymous downloads. The GCS bucket is the public
          # distribution channel — the same one the website and riddlg use.
          url "https://storage.googleapis.com/synapify-releases/#{version}/Synapify-#{version}-arm64.dmg"
          name "Synapify"
          desc "Visual RIDDL editor for designing distributed, reactive systems"
          homepage "https://ossum.ai/products/synapify"

          livecheck do
            url "https://storage.googleapis.com/synapify-releases/latest.json"
            strategy :json do |json|
              json["version"]
            end
          end

          # Synapify updates itself via electron-updater against the GCS
          # release bucket, so `brew upgrade` leaves it alone unless asked
          # with --greedy; this cask version governs fresh installs only.
          # Only an arm64 build exists, because synapify's release workflow
          # runs its macOS job on a macos-14 runner and electron-builder
          # targets the host architecture. A bare `macos:` symbol means that
          # version or newer (MacOSRequirement defaults to a >= comparator).
          auto_updates true
          depends_on macos: :monterey
          depends_on arch: :arm64

          app "Synapify.app"

          zap trash: [
            "~/Library/Application Support/Synapify",
            "~/Library/Caches/com.ossuminc.synapify",
            "~/Library/Logs/Synapify",
            "~/Library/Preferences/com.ossuminc.synapify.plist",
            "~/Library/Saved Application State/com.ossuminc.synapify.savedState",
          ]
        end
        CASK

    - name: Commit and push cask
      env:
        TAG: ${{ steps.payload.outputs.version }}
      run: |
        git config user.name "github-actions[bot]"
        git config user.email "github-actions[bot]@users.noreply.github.com"
        git add Casks/synapify.rb
        git diff --cached --quiet || git commit -m "Update synapify cask to ${TAG}"
        git push
