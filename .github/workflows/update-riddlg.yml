name: Update riddlg Formula

# Receives the repository_dispatch that riddl-generator's release.yml sends
# after each build leg publishes its tarballs, and regenerates the formula with
# the new version + sha256 values. Requires HOMEBREW_TAP_SECRET (a PAT with
# write access to this repo) to be set on the riddl-generator repo.
#
# TWO FORMULAE, and which one is written is decided by the SENDER:
#
#   Formula/riddlg.rb     - the stable line. `brew install ossuminc/tap/riddlg`
#   Formula/riddlg-rc.rb  - release candidates, opt-in BY NAME only
#
# A release candidate must never touch the stable formula: that is what a plain
# `brew install ossuminc/tap/riddlg` resolves, so overwriting it would hand the
# RC to every stable user at once. riddl-generator sends `client_payload.formula`
# accordingly; this routes on it. Same design as update-formula.yml for riddlc.

on:
  repository_dispatch:
    types: [update-riddlg]

jobs:
  update-riddlg:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout homebrew-tap
      uses: actions/checkout@v4

    - name: Extract payload
      id: payload
      env:
        # Bound to env rather than interpolated into the script: client_payload
        # is attacker-controllable on a repository_dispatch, and these values
        # reach a shell.
        IN_VERSION: ${{ github.event.client_payload.version }}
        IN_SHA_MACOS_ARM64: ${{ github.event.client_payload.sha_macos_arm64 }}
        IN_SHA_LINUX_X86: ${{ github.event.client_payload.sha_linux_x86 }}
        IN_FORMULA: ${{ github.event.client_payload.formula }}
      run: |
        set -euo pipefail
        # Dispatches that predate the `formula` field, and manual ones, mean the
        # stable formula — that was the only behaviour before RCs existed.
        FORMULA="${IN_FORMULA:-riddlg}"

        # Whitelist rather than trust: this value becomes a FILE PATH.
        case "$FORMULA" in
          riddlg)
            CLASS="Riddlg"
            CONFLICTS="riddlg-rc"
            DESC="Local RIDDL validation, docs/API generation, and AI code generation"
            ;;
          riddlg-rc)
            CLASS="RiddlgRc"
            CONFLICTS="riddlg"
            DESC="Release candidate of riddlg, the RIDDL generator"
            ;;
          *)
            echo "::error::Unknown formula '${FORMULA}' in client_payload.formula"
            exit 1
            ;;
        esac

        # The version must look like a version before it reaches a URL or a
        # commit message. Accepts 1.2.3 and 1.2.3-rc.4.
        case "$IN_VERSION" in
          ''|*[!0-9A-Za-z.-]*)
            echo "::error::Refusing suspicious version '${IN_VERSION}'"
            exit 1
            ;;
        esac

        {
          echo "version=${IN_VERSION}"
          echo "sha_macos_arm64=${IN_SHA_MACOS_ARM64}"
          echo "sha_linux_x86=${IN_SHA_LINUX_X86}"
          echo "formula=${FORMULA}"
          echo "class=${CLASS}"
          echo "conflicts=${CONFLICTS}"
          echo "desc=${DESC}"
        } >> "$GITHUB_OUTPUT"

    - name: Generate formula
      env:
        TAG: ${{ steps.payload.outputs.version }}
        SHA_MACOS_ARM64: ${{ steps.payload.outputs.sha_macos_arm64 }}
        SHA_LINUX_X86: ${{ steps.payload.outputs.sha_linux_x86 }}
        FORMULA: ${{ steps.payload.outputs.formula }}
        CLASS: ${{ steps.payload.outputs.class }}
        CONFLICTS: ${{ steps.payload.outputs.conflicts }}
        DESC: ${{ steps.payload.outputs.desc }}
      run: |
        set -euo pipefail
        # envsubst is given an EXPLICIT variable list, so Ruby's #{version} and
        # the $ORIGIN in the comment below are left alone.
        envsubst '$TAG $SHA_MACOS_ARM64 $SHA_LINUX_X86 $FORMULA $CLASS $CONFLICTS $DESC' \
          > "Formula/${FORMULA}.rb" << 'FORMULA_EOF'
        # Homebrew formula for ${FORMULA} — local RIDDL generation & codegen
        # (the riddl-generator native binary).
        # To install: brew install ossuminc/tap/${FORMULA}
        # Or: brew tap ossuminc/tap && brew install ${FORMULA}
        # Auto-generated by update-riddlg.yml - do not edit manually

        class ${CLASS} < Formula
          desc "${DESC}"
          homepage "https://ossum.tech/riddl/tools/riddlg/"
          version "${TAG}"
          license :cannot_represent # proprietary; not open source

          # Not keg_only: a release candidate exists to be exercised as `riddlg`
          # on PATH, which a keg_only formula would not be. The two lines
          # therefore conflict, and say so in both directions.
          conflicts_with "${CONFLICTS}", because: "both install a riddlg binary"

          # Native binary + a vendored libllama (in lib/, found via @rpath/$ORIGIN).
          if OS.mac? && Hardware::CPU.arm?
            url "https://storage.googleapis.com/synapify-releases/riddlg/#{version}/riddlg-#{version}-Darwin-arm64.tar.gz"
            sha256 "${SHA_MACOS_ARM64}"
            depends_on "libidn2"
            depends_on "openssl@3"
          elsif OS.linux? && Hardware::CPU.intel?
            url "https://storage.googleapis.com/synapify-releases/riddlg/#{version}/riddlg-#{version}-Linux-x86_64.tar.gz"
            sha256 "${SHA_LINUX_X86}"
            depends_on "libidn2"
            depends_on "openssl@3"
          else
            odie "riddlg has prebuilt binaries only for macOS arm64 and Linux x86_64"
          end

          def install
            # Vendored libllama/ggml are private to riddlg (found via the binary's
            # @executable_path/../lib rpath, and $ORIGIN/../lib on Linux). Install them
            # under libexec so Homebrew does NOT symlink them into HOMEBREW_PREFIX/lib
            # and collide with the ggml / llama.cpp formulae; only the binary goes on
            # the PATH. bin and lib stay siblings in libexec, so the rpath still works.
            libexec.install "bin", "lib"
            bin.install_symlink libexec/"bin/riddlg"
          end

          def caveats
            <<~EOS
              riddlg is a native binary; libllama is vendored (no separate install).

              Everything riddlg owns lives under one directory: a .riddlg in the
              working directory if there is one, else ~/.riddlg. The default AI
              model is downloaded on first use of `gen riddl` into
              <riddlg-home>/models; override with --model or RIDDLG_MODEL_URL.

              Pro features (Quarkus code generation, cloud AI providers) come with
              an Ossum subscription: run `riddlg login`.

              Verify:  riddlg info
            EOS
          end

          test do
            assert_match "riddlg", shell_output("#{bin}/riddlg --help 2>&1")
          end
        end
        FORMULA_EOF

    - name: Commit and push formula
      env:
        TAG: ${{ steps.payload.outputs.version }}
        FORMULA: ${{ steps.payload.outputs.formula }}
      run: |
        set -euo pipefail
        git config user.name "github-actions[bot]"
        git config user.email "github-actions[bot]@users.noreply.github.com"
        git add "Formula/${FORMULA}.rb"
        git diff --cached --quiet || \
          git commit -m "Update ${FORMULA} to ${TAG} (macOS arm64 + Linux x86_64)"
        git push
