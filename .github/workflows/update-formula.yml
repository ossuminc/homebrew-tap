name: Update Homebrew Formula

on:
  repository_dispatch:
    types: [update-formula]

jobs:
  update-formula:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout homebrew-tap
      uses: actions/checkout@v4

    - name: Extract payload
      id: payload
      env:
        IN_VERSION: ${{ github.event.client_payload.version }}
        IN_SHA_MACOS_ARM64: ${{ github.event.client_payload.sha_macos_arm64 }}
        IN_SHA_LINUX_X86: ${{ github.event.client_payload.sha_linux_x86 }}
        IN_SHA_JVM: ${{ github.event.client_payload.sha_jvm }}
        IN_FORMULA: ${{ github.event.client_payload.formula }}
      run: |
        # riddl's release workflow sends `formula` so a prerelease lands on the
        # RC formula instead of overwriting the stable one. Dispatches that
        # predate that field, and manual ones, mean the stable formula.
        FORMULA="${IN_FORMULA:-riddlc}"

        # Whitelist rather than trust: this value becomes a file path.
        case "$FORMULA" in
          riddlc)
            CLASS="Riddlc"
            CONFLICTS="riddlc-rc"
            DESC="Compiler for RIDDL (Reactive Interface to Domain Definition Language)"
            ;;
          riddlc-rc)
            CLASS="RiddlcRc"
            CONFLICTS="riddlc"
            DESC="Release candidate of riddlc, the RIDDL compiler"
            ;;
          *)
            echo "::error::Unknown formula '${FORMULA}' in client_payload.formula"
            exit 1
            ;;
        esac

        {
          echo "version=${IN_VERSION}"
          echo "sha_macos_arm64=${IN_SHA_MACOS_ARM64}"
          echo "sha_linux_x86=${IN_SHA_LINUX_X86}"
          echo "sha_jvm=${IN_SHA_JVM}"
          echo "formula=${FORMULA}"
          echo "class=${CLASS}"
          echo "conflicts=${CONFLICTS}"
          echo "desc=${DESC}"
        } >> "$GITHUB_OUTPUT"

    - name: Generate formula
      env:
        TAG: ${{ steps.payload.outputs.version }}
        SHA_MACOS_ARM64: ${{ steps.payload.outputs.sha_macos_arm64 }}
        SHA_LINUX_X86: ${{ steps.payload.outputs.sha_linux_x86 }}
        SHA_JVM: ${{ steps.payload.outputs.sha_jvm }}
        FORMULA: ${{ steps.payload.outputs.formula }}
        CLASS: ${{ steps.payload.outputs.class }}
        CONFLICTS: ${{ steps.payload.outputs.conflicts }}
        DESC: ${{ steps.payload.outputs.desc }}
      run: |
        envsubst '$TAG $SHA_MACOS_ARM64 $SHA_LINUX_X86 $SHA_JVM $FORMULA $CLASS $CONFLICTS $DESC' \
          > "Formula/${FORMULA}.rb" << 'FORMULA_TEMPLATE'
        # Homebrew formula for ${FORMULA} - the RIDDL compiler
        # To install: brew install ossuminc/tap/${FORMULA}
        # Or add the tap first: brew tap ossuminc/tap && brew install ${FORMULA}
        # Auto-generated by update-formula.yml - do not edit manually

        class ${CLASS} < Formula
          desc "${DESC}"
          homepage "https://github.com/ossuminc/riddl"
          version "${TAG}"
          license "Apache-2.0"

          # riddlc and riddlc-rc are mutually exclusive rather than the RC being
          # keg_only: a release candidate exists to be exercised as `riddlc` on
          # PATH, which a keg_only formula would not be.
          conflicts_with "${CONFLICTS}", because: "both install a riddlc binary"

          if OS.mac? && Hardware::CPU.arm?
            url "https://github.com/ossuminc/riddl/releases/download/#{version}/riddlc-macos-arm64.zip"
            sha256 "${SHA_MACOS_ARM64}"
            depends_on "libidn2"
            depends_on "openssl@3"
          elsif OS.linux? && Hardware::CPU.intel?
            url "https://github.com/ossuminc/riddl/releases/download/#{version}/riddlc-linux-x86_64.zip"
            sha256 "${SHA_LINUX_X86}"
            depends_on "libidn2"
            depends_on "openssl@3"
          else
            url "https://github.com/ossuminc/riddl/releases/download/#{version}/riddlc.zip"
            sha256 "${SHA_JVM}"
            depends_on "openjdk@21"
          end

          def install
            if (OS.mac? && Hardware::CPU.arm?) || (OS.linux? && Hardware::CPU.intel?)
              # Native binary - Homebrew strips the single top-level "bin/" dir
              bin.install "riddlc"
            else
              # JVM version - needs wrapper script
              rm "bin/riddlc.bat"
              libexec.install "lib"
              libexec.install "bin"

              (bin/"riddlc").write <<~EOS
                #!/bin/bash
                export JAVA_HOME="#{Formula["openjdk@21"].opt_prefix}"
                exec "#{libexec}/bin/riddlc" "$@"
              EOS
            end
          end

          def caveats
            if (OS.mac? && Hardware::CPU.arm?) || (OS.linux? && Hardware::CPU.intel?)
              <<~EOS
                riddlc is installed as a native binary. No JDK required.

                To verify the installation and see what you got:
                  riddlc info

                For help:
                  riddlc help
              EOS
            else
              <<~EOS
                riddlc requires Java 21. This formula uses openjdk@21.

                To verify the installation and see what you got:
                  riddlc info

                For help:
                  riddlc help
              EOS
            end
          end

          test do
            # `riddlc info` proves the binary runs AND that it reports the
            # version this formula claims to have installed.
            assert_match version.to_s, shell_output("#{bin}/riddlc info")
          end
        end
        FORMULA_TEMPLATE

    - name: Commit and push formula
      env:
        TAG: ${{ steps.payload.outputs.version }}
        FORMULA: ${{ steps.payload.outputs.formula }}
      run: |
        git config user.name "github-actions[bot]"
        git config user.email "github-actions[bot]@users.noreply.github.com"
        git add "Formula/${FORMULA}.rb"
        git diff --cached --quiet || \
          git commit -m "Update ${FORMULA} to ${TAG} with multi-platform native binaries"
        git push
